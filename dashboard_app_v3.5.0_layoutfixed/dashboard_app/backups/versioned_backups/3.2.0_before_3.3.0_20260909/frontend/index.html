<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DHA Data Dashboard</title><link rel="stylesheet" href="/frontend/css/dashboard.css"><link rel="stylesheet" href="/frontend/css/claude-theme.css"></head><body><div class="app-layout"><main><header><div><div class="eyebrow">DETAILED HYDROCARBON ANALYSIS</div><h2>DHA Data</h2></div><span id="status" class="pill">Ready</span></header><section class="content"><div id="error" class="error"></div><div class="hero"><div class="eyebrow">SOURCE FOLDER</div><h1>Process and review DHA data.</h1><p>One processing run builds both tables from the selected XLS folder.</p></div><div class="card folder-row"><input id="folder" class="input"><button id="browse" class="btn secondary">Browse</button><button id="process" class="btn primary">Process files</button></div><div id="kpis" class="kpis"></div><div class="table-tabs"><button class="table-tab active" data-table="table1">Table-1 · Carbon Numbers</button><button class="table-tab" data-table="table2">Table-2 · Component List</button></div><div class="card"><div class="card-head"><div><div class="eyebrow" id="tableEyebrow">DHA DATA · TABLE-1</div><h3 id="tableTitle">Carbon-number table</h3></div><div class="table-actions"><div id="componentFilter" class="component-filter"><button id="filterButton" class="btn secondary filter-button">Components: All <span>▾</span></button><div id="filterMenu" class="filter-menu"><label><input type="checkbox" value="Paraffin" checked>Paraffin</label><label><input type="checkbox" value="I-Paraffins" checked>I-Paraffins</label><label><input type="checkbox" value="Aromatics" checked>Aromatics</label><label><input type="checkbox" value="Naphthenes" checked>Naphthenes</label><label><input type="checkbox" value="Olefins" checked>Olefins</label><label><input type="checkbox" value="Unknown" checked>Unknown</label><div class="filter-menu-actions"><button id="selectAllComponents" class="filter-link">Select all</button><button id="clearComponents" class="filter-link">Clear</button></div></div></div><input id="search" class="input search" placeholder="Search active table"></div></div><div id="filterSummary" class="filter-summary">Showing all components</div><div class="table-wrap"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table><div id="empty" class="empty">Choose a folder and process the XLS files.</div></div></div></section></main></div><script src="/frontend/js/dashboard.js"></script></body></html>
